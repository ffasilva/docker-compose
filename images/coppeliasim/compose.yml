# compose.yml
services:
  coppeliasim:
    build:
      context: ../..
      dockerfile: images/coppeliasim/Dockerfile
    stop_signal: SIGINT
    stop_grace_period: 15s # specify how long Compose must wait when attempting to stop the container if it doesn't handle "stop_signal"
    platform: linux/amd64 # No current build for arm64
    container_name: coppeliasim_container
    environment:
      #COPPELIA_SIM_SCENE_FILE: laser_cutting_digital_twin.ttt #laser_cutting_adaptive_control_demo.ttt
      #COPPELIA_SIM_CONTAINER_SCENE_PATH: /app/coppeliasim_scenes/
      DISPLAY: $DISPLAY # x server related
    privileged: true # Needed for some gpu configurations.
    volumes:
      - ./coppeliasim_scenes:/app/coppeliasim_scenes/
      - /tmp/.X11-unix:/tmp/.X11-unix # x server related
      - ~/.Xauthority:/root/.Xauthority # x server related
    # Run CoppeliaSim ($COPPELIASIM_PATH is set in /scripts/install_coppeliasim_ubuntu24.sh)
    command: /bin/bash -c "
      cd "$$COPPELIASIM_PATH"
      && ./coppeliaSim.sh"